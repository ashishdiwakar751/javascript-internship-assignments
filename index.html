<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JavaScript Internship - Assignments & Capstone</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:820px;margin:30px auto;padding:0 16px;background:#0b1220;color:#e6edf7}
  h1{font-size:22px} select,button{padding:10px 14px;font-size:15px;border-radius:8px;border:0}
  button{background:#1e90ff;color:#fff;cursor:pointer} iframe{width:100%;height:420px;border:1px solid #2a3a55;border-radius:8px;background:#fff;margin-top:16px}
  p{color:#9fb0c8;font-size:14px}
</style>
</head>
<body>
<h1>JavaScript Internship: Assignments & Capstone</h1>
<p>Select a program and click Run. Prompts will appear in the browser; the output shows below (also in DevTools console, F12).</p>
<select id="pick">
  <option value="assignment1.js">Assignment 1: Variables & Data Types</option>
  <option value="assignment2.js">Assignment 2: Operators & Input</option>
  <option value="assignment3.js">Assignment 3: Conditional Logic</option>
  <option value="assignment4.js">Assignment 4: Loops</option>
  <option value="assignment5.js">Assignment 5: Functions & Scope</option>
  <option value="assignment6.js">Assignment 6: Arrays & Objects</option>
  <option value="capstone.js">Capstone: Inventory Dashboard</option>
</select>
<button id="run">Run</button>
<iframe id="out"></iframe>
<script>
document.getElementById("run").onclick = function () {
  const file = document.getElementById("pick").value;
  const doc = `<body style="margin:0;background:#0b1220;color:#d7e3f5"><pre id="o" style="margin:0;padding:12px;font:14px/1.5 monospace;white-space:pre-wrap"></pre>
  <script>
    const o=document.getElementById('o'), orig=console.log.bind(console);
    console.log=function(...a){orig(...a);o.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x).replace(/,"/g,', "').replace(/"(\\w+)":/g,'$1: '):x).join(' ')+'\\n';};
  <\/script><script src="${file}"><\/script></body>`;
  document.getElementById("out").srcdoc = doc;
};
</script>
</body>
</html>
